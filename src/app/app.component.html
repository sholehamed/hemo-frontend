<div class="app-shell">
  <aside class="sidebar" [class.open]="menuOpen()" aria-label="ناوبری اصلی">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">🩸</span>
      <span><strong>Hemo</strong><small>سامانه هموویژیلانس</small></span>
    </a>
    <p class="sidebar-caption">بخش‌های سامانه</p>
    <nav aria-label="حوزه‌های Hemo">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">نمای کلی</a>
      @for (area of areas; track area.id) {
        <a [routerLink]="['/areas', area.id]" routerLinkActive="active" (click)="closeMenu()">
          <span aria-hidden="true">{{ area.icon }}</span> {{ area.title }}
        </a>
      }
    </nav>
    <div class="sidebar-bottom">
      <a routerLink="/system/status" routerLinkActive="active" (click)="closeMenu()">وضعیت اتصال API</a>
      <p>مرحله اول · بدون احراز هویت</p>
    </div>
  </aside>
  @if (menuOpen()) {
    <button class="backdrop" type="button" aria-label="بستن منو" (click)="closeMenu()"></button>
  }
  <div class="workspace">
    <header class="topbar">
      <button class="menu-toggle" type="button" aria-label="باز و بسته کردن منو" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">☰</button>
      <div><strong>Hemo</strong><span> / زیرساخت مستقل</span></div>
      <span class="stage-label">Stage 1</span>
    </header>
    <main class="content"><router-outlet /></main>
    <footer>Hemo · {{ currentYear }} · فاقد عملیات بالینی در این مرحله</footer>
  </div>
</div>
