name: Hemo ST-04 Browser E2E
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  admission-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: sholehamed/hemo-backend
          ref: main
          path: backend
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          SQL_PASSWORD="Hemo_$(openssl rand -hex 20)_Aa9!"
          echo "::add-mask::$SQL_PASSWORD"
          echo "HEMO_CI_SQL_PASSWORD=$SQL_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name hemo-browser-sql --memory=3g \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SQL_PASSWORD" \
            -p 127.0.0.1:14333:1433 mcr.microsoft.com/mssql/server:2022-latest
      - name: Apply 88-table schema and seed synthetic users and centers
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          export HEMO_CI_SQL_CONNECTION="Server=127.0.0.1,14333;Database=master;User Id=sa;Password=$HEMO_CI_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
          dotnet test tests/Hemo.Api.IntegrationTests/Hemo.Api.IntegrationTests.csproj \
            -c Release --filter "Category=SqlServer"
      - name: Install Angular and Chromium
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start Backend and Angular dev servers
        shell: bash
        run: |
          set -euo pipefail
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS="http://127.0.0.1:5080"
          export ConnectionStrings__Hemo="Server=127.0.0.1,14333;Database=Hemo;User Id=sa;Password=$HEMO_CI_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
          (cd backend && nohup dotnet run --no-build -c Release --no-launch-profile --project src/Hemo.Api > /tmp/hemo-browser-api.log 2>&1 < /dev/null &)
          (cd frontend && nohup npm start -- --host 127.0.0.1 > /tmp/hemo-browser-frontend.log 2>&1 < /dev/null &)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5080/health/ready > /dev/null &&
               curl -fsS http://127.0.0.1:4200/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API or Angular did not become ready" >&2
          exit 1
      - name: Run real Chromium admission flow
        working-directory: frontend
        run: npx playwright test --config playwright.config.mjs
      - name: Attach diagnostic artifacts on failure
        if: failure()
        run: |
          tail -n 100 /tmp/hemo-browser-api.log 2>/dev/null || true
          tail -n 100 /tmp/hemo-browser-frontend.log 2>/dev/null || true
      - name: Upload Playwright result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hemo-st04-browser-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
